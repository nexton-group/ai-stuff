/* Two-tier color: bright hue for fills/bars/badges, darker variant (AA on glass) for text */
const TXT = {
  "#007AFF": "#0063CC", "#FF2D55": "#D11A40", "#34C759": "#1E7A34", "#E8780C": "#A85A00",
  "#AF52DE": "#8E3FB8", "#5856D6": "#5856D6", "#5AC8FA": "#0A6E9E", "#FF3B30": "#D70015",
  "#8E8E93": "#636366",
};
const txt = c => TXT[c] || c;
const INK = "#1D1D1F", BODY = "#3A3A3C", MUTED = "#636366", FAINT = "#6E6E73";

/* Clean Feather-style icon set */
function Ico({ name, size = 14, color = "currentColor", sw = 2, style }) {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: sw, strokeLinecap: "round", strokeLinejoin: "round", style: { flexShrink: 0, display: "block", ...(style || {}) } };
  switch (name) {
    case "list":      return <svg {...p}><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><line x1="4" y1="6" x2="4.01" y2="6"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="18" x2="4.01" y2="18"/></svg>;
    case "pen":       return <svg {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>;
    case "code":      return <svg {...p}><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>;
    case "fast":      return <svg {...p}><polygon points="13 19 22 12 13 5 13 19" fill={color} stroke="none"/><polygon points="2 19 11 12 2 5 2 19" fill={color} stroke="none"/></svg>;
    case "up":        return <svg {...p}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>;
    case "down":      return <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><polyline points="6 13 12 19 18 13"/></svg>;
    case "swap":      return <svg {...p}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>;
    case "plus":      return <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case "dash":      return <svg {...p}><line x1="6" y1="12" x2="18" y2="12"/></svg>;
    case "equals":    return <svg {...p}><line x1="6" y1="9" x2="18" y2="9"/><line x1="6" y1="15" x2="18" y2="15"/></svg>;
    case "alert":     return <svg {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    case "trendUp":   return <svg {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    case "trendDown": return <svg {...p}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>;
    case "box":       return <svg {...p}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22" x2="12" y2="12"/></svg>;
    case "cycle":     return <svg {...p}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>;
    case "book":      return <svg {...p}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>;
    default:          return null;
  }
}

/* ─── Modes ─── */
const MODES = [
  { id: "classic", label: "Cycle classique", short: "Classique" },
  { id: "ai2025", label: "Avec IA · 2025", short: "IA 2025", icon: "fast", grad: "linear-gradient(135deg,#007AFF,#5AC8FA)", shadow: "0 2px 8px rgba(0,122,255,0.3)" },
  { id: "ai2026", label: "Avec IA · 2026", short: "IA 2026", icon: "swap", grad: "linear-gradient(135deg,#5856D6,#AF52DE)", shadow: "0 2px 8px rgba(175,82,222,0.32)" },
];

/* ─── Deep-linkable view state (mode + open phase + role live in the URL hash) ─── */
const ROLE_IDS = ["product", "design", "dev"];
function readView() {
  if (typeof window === "undefined") return { mode: "classic", phase: null, role: null };
  const p = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const m = p.get("mode");
  // Backward compat: legacy shared links used mode=ai for the 2025 snapshot.
  const mode = m === "ai2026" ? "ai2026" : (m === "ai2025" || m === "ai") ? "ai2025" : "classic";
  const phase = phases.some(ph => ph.id === p.get("phase")) ? p.get("phase") : null;
  const role = ROLE_IDS.includes(p.get("role")) ? p.get("role") : null;
  return { mode, phase, role: phase ? role : null };
}
function writeView({ mode, phase, role }) {
  if (typeof window === "undefined") return;
  const p = new URLSearchParams();
  if (mode !== "classic") p.set("mode", mode);
  if (phase) p.set("phase", phase);
  if (phase && role) p.set("role", role);
  const qs = p.toString();
  window.history.replaceState(null, "", window.location.pathname + window.location.search + (qs ? "#" + qs : ""));
}

function SourcesSection({ isMobile }) {

    if (tone === "2026") return { bg: "rgba(175,82,222,0.12)", border: "rgba(175,82,222,0.3)", color: "#8E3FB8" };

                <div style={{ fontSize: isMobile ? 11 : 11.5, color: MUTED, marginTop: 3, lineHeight: 1.5 }}>{s.finding}</div>

}

function DevLifecycle() {
  const initialView = readView();
  const [mode, setMode] = useState(initialView.mode);
  const [activePhase, setActivePhase] = useState(initialView.phase);
  const [activeRole, setActiveRole] = useState(initialView.role);
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" ? window.innerWidth < 640 : false);
  const [copied, setCopied] = useState(false);
  const copyTimer = useRef(null);
  const isAi = mode !== "classic";
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 640);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  // Keep the URL in sync so any view is deep-linkable and survives a refresh.
  useEffect(() => { writeView({ mode, phase: activePhase, role: activeRole }); }, [mode, activePhase, activeRole]);
  // React to shared links, back/forward, and manual hash edits.
  useEffect(() => {
    const onHash = () => { const v = readView(); setMode(v.mode); setActivePhase(v.phase); setActiveRole(v.role); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  useEffect(() => () => { if (copyTimer.current) clearTimeout(copyTimer.current); }, []);
  const copyLink = () => {
    const finish = () => {
      setCopied(true);
      if (copyTimer.current) clearTimeout(copyTimer.current);
      copyTimer.current = setTimeout(() => setCopied(false), 1800);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(window.location.href).then(finish, finish);
      else finish();
    } catch (e) { finish(); }
  };

  /* Per-mode selectors — statuses always compare to the CLASSIC baseline. */
  const tasksOf = rd => mode === "classic" ? rd.classic.map(t => ({ text: t, status: "keep" })) : mode === "ai2025" ? rd.ai : rd.ai2026;
  const deliverablesOf = d => mode === "classic" ? d.classic : mode === "ai2025" ? d.ai : d.ai2026;
  const impactOf = ph => mode === "ai2026"
    ? { key: ph.aiImpact2026, label: ph.aiImpact2026Label, detail: ph.aiImpact2026Detail }
    : { key: ph.aiImpact, label: ph.aiImpactLabel, detail: ph.aiImpactDetail };

  const active = phases.find(p => p.id === activePhase);

  /* Team ratios — classic & 2025 unchanged; 2026 = orchestration-era estimate. */
  const teamRatios = {
    classic: { pm: 1, design: 0.5, dev: 6 },
    ai2025:  { pm: 1.5, design: 1, dev: 3 },
    ai2026:  { pm: 1.5, design: 1, dev: 2 },
  };
  const ratioNotes = {
    ai2025: "Source : estimation consensus mi-2025 — varie selon maturité IA de l'équipe",
    ai2026: "Source : estimation mi-2026 — le dev bascule vers l'orchestration ; varie fortement selon maturité",
  };
  const ratio = teamRatios[mode];
  const maxRatio = Math.max(ratio.pm, ratio.design, ratio.dev);
  const pctOf = r => { const t = r.pm + r.design + r.dev; return { pm: r.pm / t, design: r.design / t, dev: r.dev / t }; };
  const pctClassic = pctOf(teamRatios.classic);
  const pctNow = pctOf(ratio);
  const etpLabel = mode === "classic" ? "(classique Agile)" : mode === "ai2025" ? "(avec IA — 2025)" : "(avec IA — 2026, agentique)";

  const legendStatuses = Object.entries(statusConfig).filter(([k]) => mode === "ai2026" || k !== "critical");

  return (
    <div style={{ fontFamily: "-apple-system,'SF Pro Display','SF Pro Text','Inter','Helvetica Neue',system-ui,sans-serif", minHeight: "100vh", color: "#1D1D1F", padding: isMobile ? "16px 12px" : "28px 20px" }}>
      <div style={{ maxWidth: 1100, margin: "0 auto" }}>

        {/* Header — logo left, share right */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, marginBottom: isMobile ? 16 : 22 }}>
          <div className="glass-subtle" style={{ display: "inline-flex", alignItems: "center", padding: isMobile ? "6px 14px" : "8px 18px", borderRadius: 999 }}>
            <img src="logo_nexton.png" alt="Nexton" style={{ height: isMobile ? 18 : 22, width: "auto", display: "block" }} />
          </div>
          <button onClick={copyLink} aria-label="Copier le lien de cette vue" aria-live="polite" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: isMobile ? "8px 13px" : "9px 16px", minHeight: 40, borderRadius: 999, cursor: "pointer", border: "0.5px solid rgba(255,255,255,0.6)", background: "rgba(255,255,255,0.5)", backdropFilter: "blur(20px) saturate(1.6)", WebkitBackdropFilter: "blur(20px) saturate(1.6)", boxShadow: "0 1px 8px rgba(0,0,0,0.05)", color: copied ? "#1E7A34" : "#3A3A3C", fontSize: isMobile ? 12 : 12.5, fontWeight: 600, transition: "color 0.2s ease", fontFamily: "inherit", whiteSpace: "nowrap" }}>
            {copied
              ? <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><polyline points="20 6 9 17 4 12" /></svg>
              : <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1" /><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" /></svg>}
            <span>{copied ? "Lien copié" : "Copier le lien"}</span>
          </button>
        </div>

        {/* Hero — left aligned */}
        <div style={{ marginBottom: isMobile ? 22 : 34 }}>
          <h1 className="display" style={{ fontSize: isMobile ? 30 : 54, color: "#1D1D1F", margin: 0, letterSpacing: isMobile ? "-0.02em" : "-0.015em", lineHeight: 1.02, textTransform: "uppercase", textWrap: "balance", maxWidth: 820 }}>
            Cycle de développement<br /><span style={{ color: "#007AFF" }}>à l'ère de l'IA</span>
          </h1>
          <p style={{ fontSize: isMobile ? 13 : 16, color: "#3A3A3C", marginTop: isMobile ? 10 : 14, fontWeight: 400, lineHeight: 1.45, maxWidth: 640, textWrap: "pretty" }}>8&nbsp;phases · 3&nbsp;rôles · 3&nbsp;états. Du cycle classique au cycle assisté (2025), puis agentique (2026) — ce qui s'accélère, ce qui devient critique, ce qui se transforme.</p>

        <div style={{ display: "flex", justifyContent: "flex-start", marginBottom: isMobile ? 18 : 24 }}>

              const rk = key === "product" ? "pm" : key;
              const val = ratio[rk];
              const height = (val / maxRatio) * (isMobile ? 60 : 80);
              const pct = Math.round(pctNow[rk] * 100);
              const deltaPts = Math.round((pctNow[rk] - pctClassic[rk]) * 100);
              const deltaColor = deltaPts > 0 ? "#1E7A34" : deltaPts < 0 ? "#D70015" : "#636366";
              const deltaArrow = deltaPts > 0 ? "↑" : deltaPts < 0 ? "↓" : "=";
              return (
                <div key={key} style={{ textAlign: "center", minWidth: isMobile ? 60 : 80, flex: isMobile ? "1 1 0" : "0 0 auto" }}>
                  <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", gap: 4 }}>
                    <div style={{ fontSize: isMobile ? 18 : 22, fontWeight: 700, color: txt(cfg.color), transition: "all 0.5s" }}>{val}</div>
                    <div style={{ fontSize: isMobile ? 11 : 12, fontWeight: 600, color: "#636366" }}>ETP</div>
                  </div>
                  <div style={{ display: "inline-flex", alignItems: "center", gap: 4, marginTop: 3, padding: isMobile ? "2px 8px" : "2px 10px", borderRadius: 999, background: `${cfg.color}14`, border: `0.5px solid ${cfg.color}33` }}>

                  <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 5, fontSize: isMobile ? 11 : 12, color: "#636366", marginTop: 6 }}><Ico name={cfg.icon} size={isMobile ? 12 : 13} color={txt(cfg.color)} /> {cfg.label}</div>
                  {isAi && deltaPts !== 0 && (
                    <div style={{ marginTop: 4, fontSize: isMobile ? 10 : 11, fontWeight: 600, color: deltaColor, fontVariantNumeric: "tabular-nums", letterSpacing: "0.01em" }}>

        {/* Role convergence — the 2026 structural caveat */}
        {mode === "ai2026" && (
          <div className="glass ix-rise" style={{ borderRadius: 16, padding: isMobile ? "11px 13px" : "13px 18px", marginBottom: isMobile ? 16 : 20, display: "flex", gap: 10, alignItems: "flex-start", border: "0.5px solid rgba(175,82,222,0.32)" }}>
            <Ico name="swap" size={16} color="#8E3FB8" sw={2.25} style={{ marginTop: 2 }} />
            <div style={{ fontSize: isMobile ? 11.5 : 12.5, color: BODY, lineHeight: 1.55 }}>
              <strong style={{ color: "#8E3FB8" }}>Convergence des rôles</strong> — les frontières Produit / Design / Dev se brouillent : les designers livrent du code, les PM écrivent les specs des agents, les devs orchestrent. Les trois colonnes décrivent des fonctions, plus des métiers étanches <span style={{ color: FAINT }}>(AI in Design 2026)</span>.
            </div>

        )}

        {/* Timeline — 4×2 grid (2×4 on mobile) */}
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "repeat(2, 1fr)" : "repeat(4, 1fr)", gap: isMobile ? 8 : 10, margin: "0 0 16px" }}>
          {phases.map((phase, i) => {
            const imp = impactOf(phase);
            const impact = impactConfig[imp.key];
            const isActive = activePhase === phase.id;
            return (
              <button key={phase.id} aria-expanded={isActive} aria-label={`Phase ${i + 1} : ${phase.name} — ${phase.subtitle}`}
                onClick={() => { setActivePhase(isActive ? null : phase.id); setActiveRole(null); }}
                className={isActive ? "glass-strong" : "glass-subtle"}
                style={{ borderRadius: 16, padding: isMobile ? "11px 8px" : "14px 10px", cursor: "pointer", transition: "all 0.25s ease", textAlign: "center", position: "relative", border: isActive ? `1.5px solid ${phase.color}55` : "0.5px solid rgba(255,255,255,0.5)", background: isActive ? `linear-gradient(135deg, ${phase.color}18 0%, rgba(255,255,255,0.6) 100%)` : undefined, minHeight: isMobile ? 72 : "auto" }}>
                {isAi && <div key={mode} className="ix-pop" title={impact.label} style={{ position: "absolute", top: -8, right: -6, animationDelay: (i * 55) + "ms", display: "flex", alignItems: "center", justifyContent: "center", background: `linear-gradient(135deg, ${impact.color}, ${impact.color}CC)`, color: "#fff", borderRadius: 8, padding: "3px 5px", lineHeight: 0, boxShadow: `0 2px 6px ${impact.color}40` }}><Ico name={impact.icon} size={12} color="#fff" sw={2.75} /></div>}
                <div style={{ fontSize: isMobile ? 9 : 10, fontWeight: 600, color: txt(phase.color), textTransform: "uppercase", letterSpacing: "0.05em" }}>Phase {i + 1}</div>
                <div style={{ fontSize: isMobile ? 12 : 13, fontWeight: 700, color: "#1D1D1F", marginTop: 2, lineHeight: 1.2 }}>{phase.name}</div>
                <div style={{ fontSize: 10, color: "#636366", marginTop: 2, lineHeight: 1.2 }}>{phase.subtitle}</div>
              </button>
            );
          })}
        </div>

        <div style={{ textAlign: "left", marginBottom: isMobile ? 18 : 24 }}>
          <div className="glass-subtle" style={{ display: "inline-flex", alignItems: "center", gap: 7, borderRadius: 20, padding: isMobile ? "5px 12px" : "5px 14px", fontSize: isMobile ? 10 : 11, color: "#636366", maxWidth: "100%" }}>
            <Ico name="cycle" size={13} color="#636366" /> <span>Cycle itératif — la phase 8 alimente la phase 1</span>
          </div>
        </div>

        {/* Legend */}
        {isAi && (
          <div key={"legend-" + mode} style={{ display: "flex", gap: isMobile ? 8 : 14, justifyContent: "center", flexWrap: "wrap", marginBottom: 20 }}>
            {legendStatuses.map(([key, cfg], idx) => (
              <div key={key} className="ix-rise" style={{ animationDelay: (idx * 50) + "ms", display: "flex", alignItems: "center", gap: 5, fontSize: isMobile ? 10 : 11, color: cfg.text, fontWeight: 600 }}>
                <Ico name={cfg.icon} size={isMobile ? 11 : 12} color={cfg.text} /> {cfg.label}
              </div>
            ))}
          </div>
        )}

        {/* Phase Detail or Matrix */}
        {active ? (
          <div className="glass-strong" style={{ borderRadius: 22, overflow: "hidden", marginBottom: 24, border: `0.5px solid ${active.color}22` }}>
            <div style={{ background: `linear-gradient(135deg, ${active.color}0D 0%, ${active.color}05 100%)`, borderBottom: `0.5px solid ${active.color}18`, padding: isMobile ? "14px 16px" : "20px 24px", display: "flex", flexDirection: isMobile ? "column" : "row", justifyContent: "space-between", alignItems: isMobile ? "stretch" : "center", flexWrap: "wrap", gap: 12 }}>
              <div>
                <h2 className="display" style={{ margin: 0, fontSize: isMobile ? 20 : 26, color: txt(active.color), letterSpacing: "-0.01em", lineHeight: 1.04, textTransform: "uppercase" }}>{active.name}</h2>
                <p style={{ margin: "2px 0 0", fontSize: isMobile ? 12 : 13, color: "#636366" }}>{active.subtitle}</p>
                {isAi && (() => {
                  const imp = impactOf(active);
                  const ic = impactConfig[imp.key];
                  return (
                    <div key={mode} className="glass-subtle" style={{ marginTop: 10, padding: isMobile ? "8px 12px" : "9px 14px", borderRadius: 12, fontSize: isMobile ? 11 : 12, color: txt(ic.color), lineHeight: 1.5, display: "flex", alignItems: "flex-start", gap: 7 }}>
                      <Ico name={ic.icon} size={15} color={ic.text} sw={2.25} style={{ marginTop: 1 }} />
                      <span><strong>{imp.label}</strong> — {imp.detail}</span>
                    </div>
                  );
                })()}
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: isMobile ? "center" : "flex-start" }}>
                {Object.entries(roleConfig).map(([key, cfg]) => (
                  <button key={key} onClick={() => setActiveRole(activeRole === key ? null : key)} aria-pressed={activeRole === key}
                    style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6, background: activeRole === key ? cfg.color : "rgba(255,255,255,0.5)", border: activeRole === key ? "none" : `1px solid ${cfg.color}33`, borderRadius: 12, padding: isMobile ? "8px 13px" : "8px 15px", minHeight: 38, cursor: "pointer", fontSize: isMobile ? 11 : 12, fontWeight: 600, color: activeRole === key ? "#fff" : txt(cfg.color), transition: "all 0.2s ease", backdropFilter: "blur(10px)", boxShadow: activeRole === key ? `0 2px 8px ${cfg.color}33` : "0 1px 3px rgba(0,0,0,0.04)", flex: isMobile ? "1 1 auto" : "0 0 auto", whiteSpace: "nowrap" }}>
                    <Ico name={cfg.icon} size={isMobile ? 13 : 14} color={activeRole === key ? "#fff" : txt(cfg.color)} /> {cfg.label}
                  </button>
                ))}
              </div>
            </div>
            <div style={{ padding: isMobile ? "16px" : "20px 24px" }}>
              <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fit, minmax(280px, 1fr))", gap: isMobile ? 12 : 16 }}>
                {Object.entries(roleConfig).filter(([key]) => !activeRole || activeRole === key).map(([key, cfg]) => {
                  const roleData = active.roles[key];
                  const tasks = tasksOf(roleData);
                  return (
                    <div key={key} className="glass-subtle" style={{ borderRadius: 16, padding: isMobile ? 12 : 16 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: isMobile ? 10 : 12 }}>
                        <Ico name={cfg.icon} size={isMobile ? 16 : 18} color={txt(cfg.color)} sw={2.25} />
                        <h3 style={{ margin: 0, fontSize: isMobile ? 14 : 15, fontWeight: 700, color: txt(cfg.color) }}>{cfg.label}</h3>
                      </div>
                      <ul style={{ margin: 0, padding: 0, listStyle: "none" }}>
                        {tasks.map((task, i) => {
                          const s = statusConfig[task.status] || statusConfig.keep;
                          return (
                            <li key={i} style={{ fontSize: isMobile ? 12 : 12.5, lineHeight: 1.5, color: "#3A3A3C", padding: "6px 0 6px 8px", borderBottom: i < tasks.length - 1 ? "1px solid rgba(0,0,0,0.04)" : "none", background: isAi ? s.bg : "transparent", borderRadius: 6, marginBottom: 2 }}>
                              <div style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
                                {isAi ? <span style={{ flexShrink: 0, marginTop: 2 }}><Ico name={s.icon} size={12} color={s.text} sw={2.5} /></span>
                                  : <span style={{ width: 5, height: 5, borderRadius: "50%", background: cfg.color, flexShrink: 0, marginTop: 6 }} />}
                                <div style={{ minWidth: 0, flex: 1 }}>
                                  <span style={{ color: isAi && task.status === "reduced" ? "#6E6E73" : "#3A3A3C", fontWeight: isAi && task.status === "critical" ? 600 : 400 }}>{task.text}</span>
                                  {isAi && task.note && <div style={{ fontSize: isMobile ? 10.5 : 11, color: s.text, marginTop: 2, fontWeight: 500, lineHeight: 1.4 }}>{task.note}</div>}
                                </div>
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    </div>
                  );
                })}
              </div>
              <div className="glass-subtle" style={{ marginTop: 16, borderRadius: 14, padding: isMobile ? "12px 14px" : "14px 18px" }}>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11, fontWeight: 600, color: "#636366", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 8 }}><Ico name="box" size={13} color="#636366" /> Livrables</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {deliverablesOf(active.deliverables).map((d, i) => (
                    <span key={i} style={{ background: `${active.color}14`, border: `1px solid ${active.color}2E`, borderRadius: 10, padding: "4px 12px", fontSize: isMobile ? 11 : 12, color: txt(active.color), fontWeight: 600 }}>{d}</span>
                  ))}
                </div>
              </div>
            </div>
          </div>
        ) : (
          <div className="glass-strong" style={{ borderRadius: 22, padding: isMobile ? 14 : 24 }}>
            <h3 className="display" style={{ margin: "0 0 16px", fontSize: isMobile ? 15 : 20, color: "#1D1D1F", letterSpacing: "-0.01em", lineHeight: 1.1, textTransform: "uppercase" }}>
              Vue d'ensemble <span style={{ color: mode === "ai2026" ? "#8E3FB8" : mode === "ai2025" ? "#007AFF" : "#636366", fontWeight: 700 }}>— {mode === "classic" ? "Intensité par rôle et par phase" : mode === "ai2025" ? "Impact IA 2025 par phase" : "Impact IA 2026 par phase"}</span>
            </h3>
            <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch", margin: isMobile ? "0 -14px" : 0, padding: isMobile ? "0 14px" : 0 }}>
              <table key={mode} style={{ width: "100%", borderCollapse: "collapse", fontSize: isMobile ? 11 : 12, minWidth: isMobile ? (isAi ? 460 : 360) : "auto", tableLayout: "fixed" }}>
                <colgroup>
                  <col style={{ width: isAi ? "22%" : "28%" }} />
                  {isAi && <col style={{ width: "22%" }} />}
                  <col style={{ width: isAi ? "18.67%" : "24%" }} />
                  <col style={{ width: isAi ? "18.67%" : "24%" }} />
                  <col style={{ width: isAi ? "18.66%" : "24%" }} />
                </colgroup>
                <thead>
                  <tr>
                    <th style={{ textAlign: "left", padding: isMobile ? "8px 6px" : "10px 10px", borderBottom: "1px solid rgba(0,0,0,0.08)", color: "#636366", fontWeight: 600 }}>Phase</th>
                    {isAi && <th style={{ textAlign: "center", padding: isMobile ? "8px 6px" : "10px 10px", borderBottom: "1px solid rgba(0,0,0,0.08)", color: "#636366", fontWeight: 600 }}>Impact IA</th>}
                    {Object.values(roleConfig).map(r => (
                      <th key={r.label} style={{ textAlign: "center", padding: isMobile ? "8px 6px" : "10px 10px", borderBottom: "1px solid rgba(0,0,0,0.08)", color: txt(r.color), fontWeight: 700 }}><span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 5 }}><Ico name={r.icon} size={13} color={txt(r.color)} /> {r.label}</span></th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {phases.map(phase => {
                    const imp = impactOf(phase);
                    const impact = impactConfig[imp.key];
                    return (
                      <tr key={phase.id} role="button" tabIndex={0} aria-label={`Voir le détail de la phase ${phase.name}`}
                        onClick={() => { setActivePhase(phase.id); setActiveRole(null); }}
                        onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setActivePhase(phase.id); setActiveRole(null); } }}
                        style={{ cursor: "pointer", background: "transparent", borderRadius: 8 }}
                        onMouseEnter={e => (e.currentTarget.style.background = "rgba(0,0,0,0.02)")}
                        onMouseLeave={e => (e.currentTarget.style.background = "transparent")}>
                        <td style={{ padding: isMobile ? "10px 6px" : "12px 10px", borderBottom: "1px solid rgba(0,0,0,0.04)" }}>
                          <span style={{ color: txt(phase.color), fontWeight: 700 }}>{phase.name}</span>
                        </td>
                        {isAi && (
                          <td style={{ textAlign: "center", padding: isMobile ? "10px 6px" : "12px 10px", borderBottom: "1px solid rgba(0,0,0,0.04)" }}>
                            <span style={{ display: "inline-flex", alignItems: "center", gap: 4, background: `${impact.color}1A`, color: impact.text, borderRadius: 8, padding: isMobile ? "3px 7px" : "3px 10px", fontSize: isMobile ? 10 : 11, fontWeight: 700, whiteSpace: "nowrap" }}><Ico name={impact.icon} size={11} color={impact.text} sw={2.5} /> {impact.label}</span>
                          </td>
                        )}
                        {Object.keys(roleConfig).map(role => {
                          const tasks = mode === "classic" ? phase.roles[role].classic : mode === "ai2025" ? phase.roles[role].ai : phase.roles[role].ai2026;
                          const count = tasks.length;
                          const bars = Math.round((count / 8) * 5);
                          return (
                            <td key={role} style={{ textAlign: "center", padding: isMobile ? "10px 4px" : "12px 10px", borderBottom: "1px solid rgba(0,0,0,0.04)" }}>
                              <div style={{ display: "flex", justifyContent: "center", gap: 2 }}>
                                {[...Array(5)].map((_, i) => (
                                  <div key={i} style={{ width: isMobile ? 5 : 7, height: isMobile ? 16 : 18, borderRadius: 3, background: i < bars ? `${roleConfig[role].color}88` : `${roleConfig[role].color}15`, transition: "background 0.4s" }} />
                                ))}
                              </div>
                              <div style={{ fontSize: 10, color: "#636366", marginTop: 3 }}>{count}</div>
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <p style={{ fontSize: 11, color: "#636366", marginTop: 14, textAlign: "left" }}>{isMobile ? "Touche une phase pour le détail" : "Clique sur une phase pour le détail"}</p>
          </div>
        )}

        {/* Sources — the studies behind the 2025 & 2026 states */}
        <SourcesSection isMobile={isMobile} />

        <div style={{ textAlign: "left", marginTop: isMobile ? 14 : 18, fontSize: isMobile ? 10 : 11, color: "#6E6E73", fontWeight: 400, letterSpacing: "0.02em" }}>
          © 2026 Laurent Pantanacce pour Nexton
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DevLifecycle />);
</script>
</body>
</html>
